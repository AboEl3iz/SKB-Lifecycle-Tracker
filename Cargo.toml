[package]
name = "skb-tracer"
version = "0.1.0"
edition = "2021"
authors = ["Karim"]
description = "Production-grade eBPF SKB Lifecycle and Mutation Tracker"
license = "GPL-2.0 OR BSD-3-Clause"

[lib]
name = "skb_tracer"
path = "src/lib.rs"

[[bin]]
name = "skb-tracer"
path = "src/main.rs"

[dependencies]
libbpf-rs = "0.27"
crossbeam-channel = "0.5"
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ctrlc = "3.4"
nix = { version = "0.29", features = ["signal", "user"] }
plain = "0.2"
anyhow = "1.0"

[build-dependencies]
libbpf-cargo = "0.27"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
